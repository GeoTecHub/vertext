name: vertext_flutter
description: Flutter MVVM app converted from Kotlin City Data app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  webview_flutter: ^4.7.0

  # map + coords
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # device + permissions
  permission_handler: ^11.3.1
  geolocator: ^13.0.2
  wakelock_plus: ^1.2.9

  # bluetooth classic (SPP)
  flutter_bluetooth_serial_plus: ^0.5.1

  flutter_blue_plus: ^1.32.9
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  flutter_compass: ^0.8.1
  math_expressions: ^3.1.0
  wifi_iot: ^0.3.19
  flutter_ringtone_player: ^4.0.0+4
  url_launcher: ^6.3.0
  file_picker: ^11.0.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8


flutter:
  uses-material-design: true
  assets:
    - assets/map.html
