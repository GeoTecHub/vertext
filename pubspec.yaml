name: vertext_flutter
description: Flutter MVVM app converted from Kotlin City Data app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  webview_flutter: ^4.7.0

  # map + coords
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # device + permissions
  permission_handler: ^11.3.1
  geolocator: ^13.0.2

  # bluetooth classic (SPP)
  flutter_bluetooth_serial_plus: ^0.5.1

  flutter_blue_plus: ^1.32.9



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/map.html
